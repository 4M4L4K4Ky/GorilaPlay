<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#2d333c"/>
      <stop offset="58%" stop-color="#1b1e24"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d07a"/>
      <stop offset="45%" stop-color="#dc9f31"/>
      <stop offset="100%" stop-color="#9c6c18"/>
    </linearGradient>
    <linearGradient id="rojo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef5b4c"/>
      <stop offset="55%" stop-color="#c92b26"/>
      <stop offset="100%" stop-color="#86150f"/>
    </linearGradient>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#626a75"/>
      <stop offset="100%" stop-color="#343a42"/>
    </linearGradient>
    <linearGradient id="hocico" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d3cbb9"/>
      <stop offset="100%" stop-color="#9d9584"/>
    </linearGradient>
    <filter id="sombra" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
      <feOffset in="b" dx="0" dy="14" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.5"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="recorte">
      <rect x="32" y="32" width="960" height="960" rx="210"/>
    </clipPath>
  </defs>

  <!-- fondo -->
  <rect x="32" y="32" width="960" height="960" rx="210" fill="url(#fondo)"/>
  <g clip-path="url(#recorte)">
    <g stroke="#e0a83c" stroke-opacity="0.10" stroke-width="10">
      <path d="M512 1000 L-80 520" fill="none"/>
      <path d="M512 1000 L-40 380" fill="none"/>
      <path d="M512 1000 L110 280" fill="none"/>
      <path d="M512 1000 L310 220" fill="none"/>
      <path d="M512 1000 L512 190" fill="none"/>
      <path d="M512 1000 L714 220" fill="none"/>
      <path d="M512 1000 L914 280" fill="none"/>
      <path d="M512 1000 L1064 380" fill="none"/>
      <path d="M512 1000 L1104 520" fill="none"/>
    </g>
  </g>

  <!-- aro -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="url(#oro)" stroke-width="18"/>
  <circle cx="512" cy="512" r="404" fill="none" stroke="#f3e9d2" stroke-opacity="0.16" stroke-width="5"/>
  <g fill="#f3e9d2" fill-opacity="0.7">
    <circle cx="512" cy="82" r="8"/><circle cx="742" cy="138" r="8"/>
    <circle cx="886" cy="332" r="8"/><circle cx="886" cy="692" r="8"/>
    <circle cx="742" cy="886" r="8"/><circle cx="512" cy="942" r="8"/>
    <circle cx="282" cy="886" r="8"/><circle cx="138" cy="692" r="8"/>
    <circle cx="138" cy="332" r="8"/><circle cx="282" cy="138" r="8"/>
  </g>

  <g filter="url(#sombra)">
    <!-- orejas -->
    <circle cx="272" cy="548" r="72" fill="url(#pelo)" stroke="#1c2026" stroke-width="11"/>
    <circle cx="752" cy="548" r="72" fill="url(#pelo)" stroke="#1c2026" stroke-width="11"/>

    <!-- cabeza -->
    <path d="M512 262
             C 366 262 244 348 232 496
             C 220 646 288 752 386 790
             C 442 812 582 812 638 790
             C 736 752 804 646 792 496
             C 780 348 658 262 512 262 Z"
          fill="url(#pelo)" stroke="#1c2026" stroke-width="12"/>

    <!-- brillo superior -->
    <path d="M512 274 C 448 278 400 306 378 344
             C 428 320 466 312 512 312
             C 558 312 596 320 646 344
             C 624 306 576 278 512 274 Z"
          fill="#7c848f" fill-opacity="0.45"/>

