    <!-- ojos -->
    <ellipse cx="426" cy="512" rx="56" ry="44" fill="#f7f0e1"/>
    <ellipse cx="598" cy="512" rx="56" ry="44" fill="#f7f0e1"/>
    <circle cx="440" cy="520" r="26" fill="#14171b"/>
    <circle cx="612" cy="520" r="26" fill="#14171b"/>
    <circle cx="450" cy="508" r="8" fill="#fff"/>
    <circle cx="622" cy="508" r="8" fill="#fff"/>
    <path d="M360 500 C 390 468 452 462 486 480" fill="none" stroke="#1c2026" stroke-width="16" stroke-linecap="round"/>
    <path d="M664 500 C 634 468 572 462 538 480" fill="none" stroke="#1c2026" stroke-width="16" stroke-linecap="round"/>

    <!-- hocico -->
    <path d="M512 566
             C 420 566 358 610 358 678
             C 358 756 420 806 512 806
             C 604 806 666 756 666 678
             C 666 610 604 566 512 566 Z"
          fill="url(#hocico)" stroke="#1c2026" stroke-width="10"/>
    <ellipse cx="468" cy="660" rx="20" ry="27" fill="#23282f"/>
    <ellipse cx="556" cy="660" rx="20" ry="27" fill="#23282f"/>
    <path d="M512 692 C 512 726 460 734 444 710" fill="none" stroke="#23282f" stroke-width="11" stroke-linecap="round"/>
    <path d="M512 692 C 512 726 564 734 580 710" fill="none" stroke="#23282f" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="512" cy="630" rx="24" ry="15" fill="#8a8375" fill-opacity="0.75"/>

    <!-- diadema -->
    <path d="M258 486 C 274 306 376 200 512 200
             C 648 200 750 306 766 486"
          fill="none" stroke="url(#rojo)" stroke-width="56" stroke-linecap="round"/>
    <path d="M258 486 C 274 306 376 200 512 200
             C 648 200 750 306 766 486"
          fill="none" stroke="#f3e9d2" stroke-opacity="0.9" stroke-width="14" stroke-linecap="round"/>

    <!-- cascos -->
    <rect x="172" y="440" width="170" height="222" rx="80" fill="url(#rojo)" stroke="#1c2026" stroke-width="12"/>
    <rect x="682" y="440" width="170" height="222" rx="80" fill="url(#rojo)" stroke="#1c2026" stroke-width="12"/>
    <rect x="192" y="462" width="130" height="178" rx="62" fill="none" stroke="url(#oro)" stroke-width="9"/>
    <rect x="702" y="462" width="130" height="178" rx="62" fill="none" stroke="url(#oro)" stroke-width="9"/>
    <circle cx="257" cy="552" r="36" fill="#f3e9d2"/>
    <circle cx="767" cy="552" r="36" fill="#f3e9d2"/>
    <circle cx="257" cy="552" r="19" fill="#c92b26"/>
    <circle cx="767" cy="552" r="19" fill="#c92b26"/>
    <path d="M200 496 C 220 468 250 456 276 456" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
    <path d="M710 496 C 730 468 760 456 786 456" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
